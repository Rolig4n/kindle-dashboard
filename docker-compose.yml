services:
  kindle-dashboard:
    build: .
    container_name: kindle-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Acesso ao socket do Docker para listar containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # ── Servidor ──────────────────────────────────────────────────
      PORT: ${PORT:-3000}
      TZ: ${TZ:-America/Sao_Paulo}

      # ── OpenWeatherMap ────────────────────────────────────────────
      OWM_API_KEY: ${OWM_API_KEY}
      OWM_CITY:    ${OWM_CITY:-"Indiaporã,BR"}
      OWM_UNITS:   ${OWM_UNITS:-metric}

      # ── Clima interno (container separado) ────────────────────────
      # Deixe em branco se ainda não tiver o container de sensores
      HOME_CLIMATE_URL: ${HOME_CLIMATE_URL:-""}

      # ── RSS de notícias (separar múltiplos feeds com vírgula) ──────
      RSS_FEEDS:     ${RSS_FEEDS:-"https://g1.globo.com/rss/g1/"}
      RSS_MAX_ITEMS: ${RSS_MAX_ITEMS:-20}

      # ── Galeria de imagens (URLs separadas por vírgula) ────────────
      GALLERY_URLS: ${GALLERY_URLS:-""}

    # O dashboard não precisa de acesso à internet direto — apenas o backend faz as chamadas
    # Remova o network_mode se quiser isolar ainda mais
