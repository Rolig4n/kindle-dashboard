services:
  kindle-dashboard:
    build: .
    container_name: kindle-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # No Windows com Docker Desktop + WSL2, o socket é exposto via pipe do Windows
      # O Docker Desktop faz a ponte automaticamente — use o caminho abaixo:
      - //var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: ${PORT:-3000}
      TZ: ${TZ:-America/Sao_Paulo}
      OWM_API_KEY: ${OWM_API_KEY}
      OWM_CITY:    ${OWM_CITY:-"Indiaporã,BR"}
      OWM_UNITS:   ${OWM_UNITS:-metric}
      HOME_CLIMATE_URL: ${HOME_CLIMATE_URL:-""}
      RSS_FEEDS:     ${RSS_FEEDS:-"https://g1.globo.com/rss/g1/"}
      RSS_MAX_ITEMS: ${RSS_MAX_ITEMS:-20}
      GALLERY_URLS: ${GALLERY_URLS:-""}
